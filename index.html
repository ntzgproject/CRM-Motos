<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src=" js/Calculador.js"></script>
    <link rel="stylesheet" href="styles/index.css">
    <title>CRM Motos</title>
</head>
<body>
    <div id="Titulo">
        <h1>CRM Motos</h1>
    </div>

    <section id="Calculador">

        <div class="calculador-container">
        
            <!-- Input -->
            <div class="calculador-input">
            <input id="precio" type="number" placeholder="Precio">
            </div>

            <!-- Contado -->
        
            <div class="calculador-data" id="Contado">
                <h2>Contado</h2>
                <h3>Precio unidad: $0</h3>
                <h3>Arancel: $0</h3>
                <h3>DGR: $0</h3>
                <h3>Casco: $50.000</h3>
                <h3 class="total">Precio Final: $0</h3>
            </div>
            
            <!-- Financiado -->
            
            <div class="calculador-data" id="Financiado">
                <h2>Financiado</h2>
                <h3>Precio unidad: $0</h3>
                <h3>Arancel: $0</h3>
                <h3>DGR: $0</h3>
                <h3>Casco: $62.500</h3>
                <h3 class="total">Precio Final: $0</h3>
            </div>
        </div>

            
    <footer>
        <p>&copy; Creado por F. Colantone. Desarrollado por A. Silva </p>
    </footer>
            
    </section>
</body>
</html>
